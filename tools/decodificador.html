<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Decodificador Binario - Bóveda Vane</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff41; /* Verde terminal clásico */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h2 { text-transform: uppercase; border-bottom: 2px solid #00ff41; }
        textarea {
            width: 600px;
            height: 150px;
            background-color: #1a1a1a;
            color: #00ff41;
            border: 1px solid #00ff41;
            padding: 10px;
            font-family: inherit;
            margin-bottom: 20px;
        }
        button {
            background-color: #00ff41;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:hover { background-color: #fff; }
        #resultado {
            margin-top: 20px;
            font-size: 1.2em;
            min-height: 30px;
            color: #fff; /* Resultado en blanco para destacar */
        }
    </style>
</head>
<body>

    <h2>>> SISTEMA DE TRADUCCIÓN BINARIA <<</h2>
    <p>Pegue el código recuperado del archivo .dat:</p>
    
    <textarea id="inputBinario" placeholder="Ej: 01001000 01001111 01001100 01000001..."></textarea>
    
    <button onclick="decodificar()">Ejecutar Traducción</button>

    <div id="resultado"></div>

    <script>
        function decodificar() {
            // 1. Obtener el valor bruto del textarea
            let rawInput = document.getElementById('inputBinario').value;

            // 2. LIMPIEZA INTELIGENTE (Mejorada)
            // En lugar de solo quitar espacios, usamos una expresión regular para
            // quedarnos ÚNICAMENTE con los 0s y 1s, ignorando texto, guiones, etc.
            const entrada = rawInput.replace(/[^01]/g, '');

            // 3. Validar si quedó algo después de limpiar
            if (entrada.length === 0) {
                document.getElementById('resultado').innerText = "ERROR: NO SE ENCONTRÓ CÓDIGO BINARIO EN LA ENTRADA.";
                document.getElementById('resultado').style.color = "red";
                return;
            }

            // 4. Advertencia de longitud (Opcional pero útil)
            // Si la longitud no es múltiplo de 8, faltan bits, pero intentamos decodificar igual lo que se pueda
            if (entrada.length % 8 !== 0) {
                console.warn("Advertencia: La cadena binaria no está completa (múltiplo de 8).");
            }

            // 5. Convertir la cadena binaria a Bytes
            const bytes = [];
            for (let i = 0; i < entrada.length; i += 8) {
                const byteBinario = entrada.slice(i, i + 8);
                // Solo convertimos si tenemos el byte completo (8 bits)
                if (byteBinario.length === 8) {
                    bytes.push(parseInt(byteBinario, 2));
                }
            }

            // 6. Decodificar a Texto
            try {
                const byteArray = new Uint8Array(bytes);
                const decoder = new TextDecoder('utf-8');
                const textoFinal = decoder.decode(byteArray);

                // Mostramos el resultado con un color diferente para indicar éxito
                const resultadoDiv = document.getElementById('resultado');
                resultadoDiv.innerText = "> MENSAJE EXTRAÍDO: \n" + textoFinal;
                resultadoDiv.style.color = "#00ff41"; 
                
            } catch (e) {
                document.getElementById('resultado').innerText = "ERROR CRÍTICO AL DECODIFICAR.";
                document.getElementById('resultado').style.color = "red";
            }
        }
    </script>
</body>
</html>
